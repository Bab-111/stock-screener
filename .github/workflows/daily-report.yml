name: Stock Breakout Screener

on:
  # Run every 30 minutes on weekdays from 13:30 UTC (9:30 AM ET pre-market)
  # to 01:00 UTC next day (9:00 PM ET after-hours close)
  schedule:
    - cron: "*/30 13-23 * * 1-5"
    - cron: "*/30 0-1 * * 2-6"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo so the script and config are available
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install all Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the screener script (writes output/index.html + charts)
      - name: Run stock screener
        run: python scripts/daily_report.py

      # 5. Publish the output/ folder to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: false
          commit_message: "Auto-update: stock screener report"
