from datetime import datetime
import os

os.makedirs("output", exist_ok=True)

html = f"""
<!DOCTYPE html>
<html>
<head><title>Test Screener</title></head>
<body>
  <h1>Hello Babak!</h1>
  <p>This is a test run at {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}.</p>
</body>
</html>
"""

with open("output/index.html", "w") as f:
    f.write(html)
