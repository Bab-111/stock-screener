name: Stock Breakout Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "30 18 * * 1-5"
    - cron: "0 19 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "0 20 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "0 21 * * 1-5"
    - cron: "30 21 * * 1-5"
    - cron: "0 22 * * 1-5"
    - cron: "30 22 * * 1-5"
    - cron: "0 23 * * 1-5"
    - cron: "30 23 * * 1-5"
    - cron: "0 0 * * 2-6"
    - cron: "30 0 * * 2-6"
    - cron: "0 1 * * 2-6"

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python scripts/daily_report.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
